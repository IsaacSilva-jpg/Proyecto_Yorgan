<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Nuevo reporte | Yorgan</title>
</head>
<body style="margin:0; padding:0; background-color:#0d0f14; color:#e8eaf0; font-family:Arial, Helvetica, sans-serif;">
  <!-- Texto breve de previsualización -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
    Se recibió un nuevo reporte en Yorgan.
  </div>

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#0d0f14" style="width:100%; background-color:#0d0f14;">
    <tr>
      <td align="center" style="padding:36px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; max-width:600px;">
          <!-- Marca -->
          <tr>
            <td style="padding:0 0 20px 2px;">
              <span style="font-family:Georgia, 'Times New Roman', serif; font-size:25px; font-weight:bold; letter-spacing:-0.5px; color:#e8eaf0;">Yor</span><span style="font-family:Georgia, 'Times New Roman', serif; font-size:25px; font-weight:bold; letter-spacing:-0.5px; color:#e8c46a;">gan</span>
            </td>
          </tr>

          <!-- Reporte -->
          <tr>
            <td bgcolor="#161a23" style="background-color:#161a23; border:1px solid #2a3045; border-radius:12px; padding:30px 28px;">
              <p style="margin:0 0 10px; color:#e8c46a; font-size:11px; line-height:18px; letter-spacing:1.5px; text-transform:uppercase;">Nuevo reporte</p>
              <h1 style="margin:0 0 22px; color:#e8eaf0; font-family:Georgia, 'Times New Roman', serif; font-size:25px; line-height:1.3; font-weight:bold;">{{ tipo_de_reporte }}</h1>

              <!-- Datos del usuario -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%; margin:0 0 22px;">
                <tr>
                  <td width="76" style="padding:9px 0; border-bottom:1px solid #2a3045; color:#7a85a0; font-size:13px; line-height:19px;">Nombre</td>
                  <td style="padding:9px 0; border-bottom:1px solid #2a3045; color:#e8eaf0; font-size:13px; line-height:19px;">{{ nombre }}</td>
                </tr>
                <tr>
                  <td width="76" style="padding:9px 0; color:#7a85a0; font-size:13px; line-height:19px;">Correo</td>
                  <td style="padding:9px 0; color:#e8eaf0; font-size:13px; line-height:19px; word-break:break-word;">
                    <a href="mailto:{{ correo }}" style="color:#e8c46a; text-decoration:none;">{{ correo }}</a>
                  </td>
                </tr>
              </table>

              <!-- Contenido del reporte -->
              <p style="margin:0 0 9px; color:#7a85a0; font-size:11px; line-height:18px; letter-spacing:1px; text-transform:uppercase;">Mensaje</p>
              <div style="padding:16px; background-color:#1c2130; border:1px solid #2a3045; border-radius:8px; color:#c4c9d4; font-size:14px; line-height:1.65; white-space:pre-line; overflow-wrap:break-word;">{{ texto_reporte }}</div>

              <!-- Respuesta directa -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin:24px 0 0;">
                <tr>
                  <td align="center" bgcolor="#e8c46a" style="background-color:#e8c46a; border-radius:8px;">
                    <a href="mailto:{{ correo }}?subject=Re%3A%20{{ tipo_de_reporte|urlencode }}" style="display:inline-block; padding:12px 20px; color:#0d0f14; font-size:13px; line-height:20px; font-weight:bold; text-decoration:none;">Responder al usuario</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Pie -->
          <tr>
            <td align="center" style="padding:20px 12px 0;">
              <p style="margin:0; color:#7a85a0; font-size:11px; line-height:1.7;">Notificación automática de Yorgan.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
