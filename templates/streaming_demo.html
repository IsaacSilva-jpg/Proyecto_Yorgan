<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Output en Tiempo Real (Typewriter Effect)</title>
    <!-- Tailwind CSS for modern responsive layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            50: '#f0f4f9',
                            100: '#e1e9f5',
                            500: '#1a73e8',
                            600: '#1557b0',
                            900: '#0d1b2a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor-blink::after {
            content: '▋';
            display: inline-block;
            margin-left: 2px;
            color: #3b82f6;
            animation: blink 0.8s infinite;
            vertical-align: baseline;
        }

        /* Smooth scroll for message container */
        .chat-scroll {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans">

    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-10 px-6 py-4">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></div>
                <h1 class="text-xl font-semibold tracking-wide text-white">Simulador de Streaming LLM</h1>
            </div>
            <span class="text-xs px-2.5 py-1 bg-blue-900/50 text-blue-300 rounded-full border border-blue-700/50">
                Efecto Typewriter
            </span>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
        
        <!-- Controls Panel -->
        <section class="bg-gray-800/60 border border-gray-700/60 rounded-xl p-5 shadow-lg backdrop-blur">
            <h2 class="text-sm font-medium text-gray-400 mb-3 uppercase tracking-wider">Configuración del Generador</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- Speed Control -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="speedRange" class="text-sm text-gray-300">Velocidad de Escritura:</label>
                        <span id="speedValue" class="text-xs font-mono text-blue-400">25 ms / chunk</span>
                    </div>
                    <input type="range" id="speedRange" min="5" max="100" value="25" step="5"
                        class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>Muy Rápido</span>
                        <span>Lento</span>
                    </div>
                </div>

                <!-- Chunk Size mode -->
                <div>
                    <label for="chunkMode" class="block text-sm text-gray-300 mb-1">Modo de Envío (Chunks):</label>
                    <select id="chunkMode" class="w-full bg-gray-900 border border-gray-700 text-gray-200 text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="char">Carácter por Carácter (Suave)</option>
                        <option value="word">Palabra por Palabra (Estilo Gemini/ChatGPT)</option>
                        <option value="burst">Bloques Variables (Simulación de Red)</option>
                    </select>
                </div>
            </div>

            <!-- Custom Text Input -->
            <div class="mb-4">
                <label for="customText" class="block text-sm text-gray-300 mb-1">Texto a transmitir:</label>
                <textarea id="customText" rows="3" 
                    class="w-full bg-gray-900 border border-gray-700 text-gray-200 text-sm rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none"
                    placeholder="Escribe aquí el texto que deseas ver en streaming...">El streaming de texto funciona mediante un generador HTTP en el backend. En lugar de esperar a que todo el modelo de IA genere la wuesta completa (lo cual tomaría varios segundos en silencio), la función emite fragmentos de texto conforme se van creando. El cliente recibe esta transmisión mediante Server-Sent Events (SSE) o WebSockets y renderiza las palabras en tiempo real con este elegante efecto de máquina de escribir.</textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3">
                <button id="startBtn" onclick="startStreaming()" 
                    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-lg shadow-md transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Iniciar Transmisión
                </button>
                <button id="stopBtn" onclick="stopStreaming()" disabled
                    class="px-5 py-2.5 bg-gray-700 hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium text-sm rounded-lg transition-all flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Pausar / Detener
                </button>
                <button onclick="clearOutput()" 
                    class="px-4 py-2.5 border border-gray-700 hover:bg-gray-800 text-gray-300 font-medium text-sm rounded-lg transition-all ml-auto">
                    Limpiar
                </button>
            </div>
        </section>

        <section class="flex-1 bg-gray-950 border border-gray-800 rounded-xl p-6 shadow-2xl flex flex-col justify-between min-h-[300px]">
            <div id="outputContainer" class="chat-scroll overflow-y-auto max-h-[450px] pr-2">
                <div class="flex items-start gap-4 mb-4">
                    <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-xs font-bold text-white shrink-0 shadow-lg">
                        AI
                    </div>
                    <div class="flex-1 pt-1">
                        <div id="output" class="text-gray-200 leading-relaxed text-base font-sans whitespace-pre-wrap"></div>
                    </div>
                </div>
            </div>

            <!-- Status Indicator Bar -->
            <div class="border-t border-gray-800/80 pt-3 mt-4 flex items-center justify-between text-xs text-gray-500">
                <span id="statusText" class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-gray-600"></span> Listo para comenzar
                </span>
                <span id="charCount">0 caracteres</span>
            </div>
        </section>

    </main>

    <script>
        // State Variables
        let isStreaming = false;
        let streamTimeout = null;
        let currentIndex = 0;
        let currentText = '';

        // DOM Elements
        const outputEl = document.getElementById('output');
        const customTextEl = document.getElementById('customText');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');
        const chunkMode = document.getElementById('chunkMode');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusText = document.getElementById('statusText');
        const charCount = document.getElementById('charCount');
        const outputContainer = document.getElementById('outputContainer');

        // Update speed label
        speedRange.addEventListener('input', (e) => {
            speedValue.textContent = `${e.target.value} ms / chunk`;
        });

        // Clear output display
        function clearOutput() {
            stopStreaming();
            currentIndex = 0;
            outputEl.textContent = '';
            outputEl.classList.remove('cursor-blink');
            updateStatus('ready', 'Listo para comenzar');
            charCount.textContent = '0 caracteres';
        }

        // Helper to update status bar
        function updateStatus(state, message) {
            if (state === 'streaming') {
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-ping"></span> <span class="text-green-400">${message}</span>`;
            } else if (state === 'paused') {
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-500"></span> <span class="text-yellow-400">${message}</span>`;
            } else if (state === 'completed') {
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500"></span> <span class="text-blue-400">${message}</span>`;
            } else {
                statusText.innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-600"></span> ${message}`;
            }
        }

        // Get next chunk based on mode
        function getNextChunk(text, index, mode) {
            if (index >= text.length) return '';

            if (mode === 'char') {
                return text[index];
            } else if (mode === 'word') {
                // Find next space or punctuation
                let nextSpace = text.indexOf(' ', index);
                if (nextSpace === -1) return text.substring(index);
                return text.substring(index, nextSpace + 1);
            } else if (mode === 'burst') {
                // Random chunk size (1 to 8 chars) to simulate network variability
                let size = Math.floor(Math.random() * 8) + 1;
                return text.substring(index, index + size);
            }
            return text[index];
        }

        // Core Generator Function (Simulates backend yield stream)
        function* textStreamGenerator(text, mode) {
            let index = 0;
            while (index < text.length) {
                let chunk = getNextChunk(text, index, mode);
                index += chunk.length;
                yield chunk;
            }
        }

        let currentGenerator = null;

        // Start Streaming Process
        function startStreaming() {
            if (isStreaming) return;

            if (currentIndex === 0 || outputEl.textContent === '') {
                outputEl.textContent = '';
                currentText = customTextEl.value || customTextEl.placeholder;
                currentGenerator = textStreamGenerator(currentText, chunkMode.value);
            }

            isStreaming = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            outputEl.classList.add('cursor-blink');
            updateStatus('streaming', 'Recibiendo datos en tiempo real (Streaming)...');

            processNextChunk();
        }

        // Process each chunk iteratively
        function processNextChunk() {
            if (!isStreaming) return;

            const result = currentGenerator.next();

            if (!result.done) {
                // Append chunk to UI
                outputEl.textContent += result.value;
                currentIndex += result.value.length;
                charCount.textContent = `${outputEl.textContent.length} caracteres`;

                // Auto-scroll to bottom of text
                outputContainer.scrollTop = outputContainer.scrollHeight;

                // Calculate delay with slight variable jitter for realism
                const baseSpeed = parseInt(speedRange.value, 10);
                const jitter = Math.random() * 10 - 5;
                const delay = Math.max(5, baseSpeed + jitter);

                streamTimeout = setTimeout(processNextChunk, delay);
            } else {
                // Stream Finished
                finishStreaming();
            }
        }

        // Stop/Pause Streaming
        function stopStreaming() {
            isStreaming = false;
            clearTimeout(streamTimeout);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            outputEl.classList.remove('cursor-blink');
            if (currentIndex < currentText.length && currentIndex > 0) {
                updateStatus('paused', 'Transmisión pausada');
            }
        }

        // Complete Streaming
        function finishStreaming() {
            isStreaming = false;
            clearTimeout(streamTimeout);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            currentIndex = 0;
            outputEl.classList.remove('cursor-blink');
            updateStatus('completed', 'Transmisión completada exitosamente');
        }

        // Start animation automatically on load
        window.onload = function() {
            startStreaming();
        };
    </script>
</body>
</html>
